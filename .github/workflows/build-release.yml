name: Build Release APK

# Builds the signed Online Edition APK from the `custom` branch and publishes
# it as a GitHub Release. Runs on every push to custom (your updates AND the
# automatic upstream merges) and can be run manually from the Actions tab.

on:
  push:
    branches: [custom]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout custom
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK (cmdline-tools, NDK, CMake)
        run: |
          set -e
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          CDL="$(mktemp -d)"
          curl -sSL -o "$CDL/tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q "$CDL/tools.zip" -d "$CDL/out"
          mv "$CDL/out/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms;android-28" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Restore release keystore
        env:
          MH_KEYSTORE_BASE64: ${{ secrets.MH_KEYSTORE_BASE64 }}
        run: |
          echo "$MH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mh-release.jks"
          test -s "$RUNNER_TEMP/mh-release.jks" || { echo "keystore missing"; exit 1; }

      - name: Detect base version
        id: ver
        run: |
          BASE="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base version: $BASE, run number: ${{ github.run_number }}"

      # Antigravity CLI installs ONLY from the bundle embedded inside the APK
      # (RuntimeInstaller.ensureAgyInstalled uses forceEmbedded=true and the app
      # rejects a missing asset). dist/runtime-bundles/*.tar.zst is gitignored,
      # so pull the exact pinned bundle the upstream developer publishes and
      # stage it where prepareBundledAgentAssets (app/build.gradle.kts) copies
      # it into the APK. Name/tag/sha are parsed from source so upstream version
      # bumps are picked up automatically; a mismatch fails the build loudly
      # instead of shipping an APK where Antigravity cannot install.
      - name: Fetch embedded Antigravity runtime bundle
        run: |
          set -e
          FILE="$(grep -oP 'pocketdev-agy-arm64-[0-9.]+\.tar\.zst' app/build.gradle.kts | head -1)"
          TAG="$(grep -oP 'releases/download/\Kruntime-[0-9.]+' app/build.gradle.kts | head -1)"
          EXPECTED="$(grep -A4 'AGY_BUNDLE = RuntimeBundle' app/src/main/java/com/jarves/mh/runtime/RuntimeInstaller.kt | grep -oP 'sha256 = "\K[0-9a-f]{64}' | head -1)"
          if [ -z "$FILE" ] || [ -z "$TAG" ] || [ -z "$EXPECTED" ]; then
            echo "Could not parse agy bundle name/tag/sha from source (FILE=$FILE TAG=$TAG)"
            exit 1
          fi
          URL="https://github.com/techjarves/Mobile-Harness/releases/download/${TAG}/${FILE}"
          echo "Fetching $URL"
          curl -fL --retry 3 --retry-delay 5 -o "dist/runtime-bundles/${FILE}" "$URL"
          ACTUAL="$(sha256sum "dist/runtime-bundles/${FILE}" | cut -d' ' -f1)"
          echo "bundle: $FILE ($(wc -c < "dist/runtime-bundles/${FILE}") bytes)"
          echo "sha256 expected=$EXPECTED"
          echo "sha256 actual  =$ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "FATAL: Antigravity bundle checksum mismatch"; exit 1; }
          echo "agy_file=$FILE" >> "$GITHUB_ENV"

      - name: Build signed Online release APK
        env:
          MH_UPLOAD_STORE_FILE: ${{ runner.temp }}/mh-release.jks
          MH_UPLOAD_STORE_PASSWORD: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          MH_UPLOAD_KEY_ALIAS: ${{ secrets.MH_KEY_ALIAS }}
          MH_UPLOAD_KEY_PASSWORD: ${{ secrets.MH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOnlineRelease \
            -PappVersionCode=$((1000 + ${{ github.run_number }})) \
            -PappVersionName="${{ steps.ver.outputs.base }}-c${{ github.run_number }}" \
            --stacktrace

      # Fail loudly if the agy bundle ever stops being embedded again.
      - name: Verify Antigravity bundle is inside the APK
        run: |
          set -e
          APK="$(ls app/build/outputs/apk/online/release/*release*.apk | head -1)"
          FILE="${{ env.agy_file }}"
          if ! unzip -l "$APK" | grep -q "assets/runtime/${FILE}"; then
            echo "FATAL: assets/runtime/${FILE} missing from APK — Antigravity would fail to install"
            unzip -l "$APK" | grep "assets/" || true
            exit 1
          fi
          echo "Antigravity bundle embedded OK ($(unzip -l "$APK" | grep -o "assets/runtime/${FILE}" | head -1))"

      - name: Rename APK
        id: apk
        run: |
          SRC="app/build/outputs/apk/online/release"
          APK="$(ls "$SRC"/*release*.apk | head -1)"
          OUT="MobileHarness-${{ steps.ver.outputs.base }}-c${{ github.run_number }}.apk"
          cp "$APK" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.base }}-c${{ github.run_number }}
          name: Mobile Harness ${{ steps.ver.outputs.base }} (custom build ${{ github.run_number }})
          body: |
            Signed release APK from the `custom` branch (upstream ${{ steps.ver.outputs.base }} + your updates).
            - Build: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Antigravity CLI runtime bundle embedded (version-pinned)
            - Ollama Cloud provider included
            Install directly over the previous custom build (same signature).
          files: ${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true
