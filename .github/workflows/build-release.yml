name: Build Release APK

# Builds the signed Online Edition APK from the `custom` branch and publishes
# it as a GitHub Release. Runs on every push to custom (your updates AND the
# automatic upstream merges) and can be run manually from the Actions tab.

on:
  push:
    branches: [custom]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout custom
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK (cmdline-tools, NDK, CMake)
        run: |
          set -e
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          CDL="$(mktemp -d)"
          curl -sSL -o "$CDL/tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q "$CDL/tools.zip" -d "$CDL/out"
          mv "$CDL/out/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms;android-28" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Restore release keystore
        env:
          MH_KEYSTORE_BASE64: ${{ secrets.MH_KEYSTORE_BASE64 }}
        run: |
          echo "$MH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mh-release.jks"
          test -s "$RUNNER_TEMP/mh-release.jks" || { echo "keystore missing"; exit 1; }

      - name: Detect base version
        id: ver
        run: |
          BASE="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base version: $BASE, run number: ${{ github.run_number }}"

      - name: Build signed Online release APK
        env:
          MH_UPLOAD_STORE_FILE: ${{ runner.temp }}/mh-release.jks
          MH_UPLOAD_STORE_PASSWORD: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          MH_UPLOAD_KEY_ALIAS: ${{ secrets.MH_KEY_ALIAS }}
          MH_UPLOAD_KEY_PASSWORD: ${{ secrets.MH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOnlineRelease \
            -PappVersionCode=$((1000 + ${{ github.run_number }})) \
            -PappVersionName="${{ steps.ver.outputs.base }}-c${{ github.run_number }}" \
            --stacktrace

      - name: Rename APK
        id: apk
        run: |
          SRC="app/build/outputs/apk/online/release"
          APK="$(ls "$SRC"/*release*.apk | head -1)"
          OUT="MobileHarness-${{ steps.ver.outputs.base }}-c${{ github.run_number }}.apk"
          cp "$APK" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.base }}-c${{ github.run_number }}
          name: Mobile Harness ${{ steps.ver.outputs.base }} (custom build ${{ github.run_number }})
          body: |
            Signed release APK from the `custom` branch (upstream ${{ steps.ver.outputs.base }} + your updates).
            - Build: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            Install directly over the previous custom build (same signature).
          files: ${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true
